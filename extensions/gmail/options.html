<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <title>Routine Gmail</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        padding: 14px;
        width: 360px;
        color: #0f172a;
      }
      label {
        display: block;
        font-size: 12px;
        color: #475569;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
        padding: 8px 12px;
        cursor: pointer;
        margin-right: 6px;
        margin-bottom: 6px;
      }
      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
      p,
      code {
        font-size: 12px;
        color: #64748b;
        margin: 8px 0 0;
      }
      code {
        display: block;
        word-break: break-all;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px;
        color: #0f172a;
      }
      #status {
        margin-top: 8px;
        min-height: 1em;
      }
      #status.ok {
        color: #047857;
      }
      #status.err {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <label for="appBaseUrl">Routine URL</label>
    <input id="appBaseUrl" type="url" placeholder="http://localhost:3120" />

    <label for="gmailClientId">Gmail OAuth Client ID</label>
    <input
      id="gmailClientId"
      type="text"
      placeholder="….apps.googleusercontent.com"
    />

    <p>Redirect URI (ieliec Google Cloud OAuth klientā):</p>
    <code id="redirectUri">…</code>

    <div style="margin-top: 12px">
      <button type="button" id="save">Saglabāt</button>
      <button type="button" id="connectGmail" class="secondary">
        Savienot Gmail
      </button>
    </div>
    <p id="status"></p>
    <p>
      Ielogojies Routine tajā pašā Chrome profilā. Pielikumi nāk caur Gmail API
      (līdz 25 MB; lielākiem failiem vajag komandas Google Drive).
    </p>
    <script src="options.js"></script>
  </body>
</html>
