<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <title>Routine Gmail</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        padding: 14px;
        width: 340px;
        color: #0f172a;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
        padding: 8px 12px;
        cursor: pointer;
        margin-right: 6px;
        margin-bottom: 6px;
      }
      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
        font: inherit;
      }
      label {
        display: block;
        font-size: 12px;
        color: #475569;
        margin-bottom: 4px;
      }
      p {
        font-size: 12px;
        color: #64748b;
        margin: 8px 0 0;
      }
      .warn {
        color: #b91c1c;
        font-weight: 600;
      }
      .ok {
        color: #047857;
      }
      .err {
        color: #b91c1c;
      }
      .account {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }
      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        object-fit: cover;
        background: #0f766e;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex-shrink: 0;
      }
      .avatar img {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        object-fit: cover;
        display: block;
      }
      .name {
        font-weight: 700;
        font-size: 14px;
        line-height: 1.3;
      }
      .email {
        font-size: 12px;
        color: #64748b;
        word-break: break-all;
      }
      #status {
        min-height: 1em;
        margin-top: 8px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <p id="boot"></p>
    <div id="login" class="hidden">
      <p id="loginHint"></p>
      <div id="googleWrap" class="hidden">
        <button type="button" id="googleLogin"></button>
      </div>
      <div id="passwordWrap" class="hidden">
        <label for="email" id="emailLabel"></label>
        <input id="email" type="email" autocomplete="username" />
        <label for="password" id="passwordLabel"></label>
        <input id="password" type="password" autocomplete="current-password" />
        <button type="button" id="passwordLogin"></button>
      </div>
    </div>
    <div id="account" class="hidden">
      <div class="account">
        <div class="avatar" id="avatarFallback">R</div>
        <div>
          <div class="name" id="displayName"></div>
          <div class="email" id="displayEmail"></div>
        </div>
      </div>
      <label for="team" id="teamLabel"></label>
      <select id="team"></select>
      <p id="driveWarn" class="warn hidden"></p>
      <p id="gmailStatus"></p>
      <p id="pluginWarn" class="warn hidden"></p>
      <div>
        <button type="button" id="connectGmail" class="hidden"></button>
        <button type="button" id="signOut" class="secondary"></button>
      </div>
    </div>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
